name: Daily NVD Sync and Synthetic Experiment
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      days:
        description: Days to fetch (1-120)
        default: '7'
      max_cves:
        description: Maximum CVEs
        default: '500'
permissions:
  contents: read
jobs:
  sync-and-evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-ml.txt
      - run: python -m pip install -r requirements-ml.txt
      - name: Fetch CVEs
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          DAYS: ${{ inputs.days || '7' }}
          MAX_CVES: ${{ inputs.max_cves || '500' }}
        run: python -m data.nvd_fetcher --days "$DAYS" --max "$MAX_CVES" --output cves_latest.json
      - name: Save synthetic experiment
        run: python -m ml.trainer --data data/cves_latest.json --synthetic --seed 42 --model-dir experiments/latest
      - name: Summary
        run: |
          echo "## Synthetic experiment only" >> "$GITHUB_STEP_SUMMARY"
          echo "F1 is not real-world exploitation performance. No model is promoted." >> "$GITHUB_STEP_SUMMARY"
          echo '~~~json' >> "$GITHUB_STEP_SUMMARY"
          cat experiments/latest/metrics.json >> "$GITHUB_STEP_SUMMARY"
          echo '~~~' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-experiment-${{ github.run_number }}
          path: |
            backend/experiments/latest/
            backend/data/cves_latest.json
          if-no-files-found: error
          retention-days: 30

